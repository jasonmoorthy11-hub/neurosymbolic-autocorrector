<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dashboard for the Neurosymbolic Autocorrector: AI agent replies checked against policy rules and plan facts, with the rule and source behind each policy or fact correction."
    />
    <!-- Link previews. Scrapers need absolute URLs, so these name the public demo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Neurosymbolic Autocorrector" />
    <meta property="og:title" content="Neurosymbolic Autocorrector: replay demo" />
    <meta
      property="og:description"
      content="AI agent replies checked against policy rules and plan facts, then allowed, corrected or escalated. A replay of recorded offline runs, with the rule and source behind each correction."
    />
    <meta property="og:url" content="https://jasonmoorthy11-hub.github.io/neurosymbolic-autocorrector/" />
    <meta
      property="og:image"
      content="https://jasonmoorthy11-hub.github.io/neurosymbolic-autocorrector/social-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The replay dashboard: correction metrics, an agent feed of corrected replies and the pipeline trace for one of them"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Neurosymbolic Autocorrector Dashboard</title>
    <script>
      // Set the theme before first paint (same key and rules as src/theme/theme.ts).
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("autocorrector-theme");
        } catch (e) {}
        if (pref !== "light" && pref !== "dark") {
          pref = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = pref;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
