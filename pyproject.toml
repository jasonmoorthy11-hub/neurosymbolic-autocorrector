[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurosymbolic-autocorrector"
dynamic = ["version"]
description = "Real-time policy-grounded correction of LLM agent outputs (knowledge-graph rules + symbolic checks + optional LLM rewrite)"
license = "MIT"
# guardrails-ai pulls in fastuuid, whose build (PyO3) does not support 3.15 yet
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Jason Moorthy", email = "jasonmoorthy11@gmail.com" },
]

dependencies = [
    # MCP Server
    "mcp>=1.25,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",

    # LLM Clients
    "anthropic>=2.4,<3",
    "openai>=1.60",

    # Data & Validation
    "pydantic>=2.10",
    "pydantic-settings>=2.7",

    # Language Detection
    "fast-langdetect>=1.0",

    # Infrastructure
    "aiosqlite>=0.20",
    "cachetools>=5.5",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0",  # scripts/seed_neo4j.py; also a pydantic-settings dependency
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",  # the dashboard tests drive the app through httpx's ASGI transport
    "pyyaml>=6.0",  # tests/test_docker_config.py reads docker-compose.yml
    "ruff>=0.9",
]
neo4j = [
    "neo4j>=6.1,<7",
]
# Experimental and not imported by the package. llama-index-graph-stores-neo4j
# requires neo4j<6, which conflicts with the [neo4j] extra, so it is not in [all].
graphrag = [
    "neo4j-graphrag[openai]>=1.13,<2",
    "llama-index>=0.12",
    "llama-index-graph-stores-neo4j>=0.5",
    "pyshacl>=0.26",
    "rdflib>=7.1",
]
langgraph = [
    "langgraph>=1.0,<2",
]
guardrails = [
    "guardrails-ai>=0.9",
]
nemo = [
    "nemoguardrails>=0.20",
    "langchain-openai>=0.3",  # configs/nemo/config.yml uses `engine: openai`
]
all = [
    "neurosymbolic-autocorrector[neo4j,langgraph,guardrails]",
]

[project.scripts]
autocorrector = "autocorrector.mcp_server.server:main"

[tool.hatch.version]
path = "src/autocorrector/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/autocorrector"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/autocorrector/evaluation/dataset.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Deprecations raised inside third-party packages on Python 3.14 (about 4,500 per
# run, all from these five). Warnings from this package's own code still show.
filterwarnings = [
    "ignore::DeprecationWarning:guardrails.*",
    "ignore::DeprecationWarning:uvloop.*",
    "ignore::DeprecationWarning:typer.*",
    "ignore::DeprecationWarning:slowapi.*",
    "ignore::DeprecationWarning:langsmith.*",
]
