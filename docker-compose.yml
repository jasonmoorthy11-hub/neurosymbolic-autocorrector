# One command brings the stack up from a fresh clone:
#   docker compose up --build
# Neo4j starts first; `seed` loads the default policies once it is healthy (an
# empty graph answers every policy check with "no rules"); the API waits for the
# seed; nginx serves the built dashboard and proxies /api and /ws to the API.
# The Neo4j password is the stack's own default, not a secret. A `.env` is read
# when present (API keys for the LLM tier) and never required.
x-neo4j-env: &neo4j-env
  AUTOCORRECTOR_NEO4J_URI: bolt://neo4j:7687
  AUTOCORRECTOR_NEO4J_USER: neo4j
  AUTOCORRECTOR_NEO4J_PASSWORD: changeme

services:
  autocorrector:
    build:
      context: .
      target: production
    image: neurosymbolic-autocorrector:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *neo4j-env
      AUTOCORRECTOR_CORS_ORIGINS: '["http://localhost:3000","http://localhost:8080"]'
      # The dashboard's nginx (fixed address below): the only peer whose
      # X-Forwarded-For the rate limiter believes
      AUTOCORRECTOR_TRUSTED_PROXIES: '["172.31.250.10"]'
    depends_on:
      neo4j:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: seeds the default policies, facts and templates (idempotent MERGEs)
  seed:
    build:
      context: .
      target: production
    image: neurosymbolic-autocorrector:local
    command: ["python", "scripts/seed_neo4j.py"]
    environment: *neo4j-env
    depends_on:
      neo4j:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/changeme
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      # Probe bolt, which the seed and the API use; the HTTP port can answer first
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p changeme 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  # Built from source (dashboard/Dockerfile): the live-mode bundle behind nginx,
  # which proxies /api and /ws to the API container (dashboard/nginx.conf)
  dashboard:
    build:
      context: ./dashboard
    ports:
      - "3000:80"
    depends_on:
      - autocorrector
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.31.250.10

# A fixed subnet so the proxy has a known address (AUTOCORRECTOR_TRUSTED_PROXIES).
# If it collides with a network on your machine, change both together.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  neo4j_data:
