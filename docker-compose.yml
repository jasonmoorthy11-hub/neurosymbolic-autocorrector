services:
  autocorrector:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AUTOCORRECTOR_NEO4J_URI=bolt://neo4j:7687
      - AUTOCORRECTOR_CORS_ORIGINS=["http://localhost:3000","http://localhost:8080"]
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/changeme
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  dashboard:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./dashboard/dist:/usr/share/nginx/html:ro
    depends_on:
      - autocorrector
    restart: unless-stopped

volumes:
  neo4j_data:
