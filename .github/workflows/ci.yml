name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (offline)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    env:
      # Offline by design: no API keys or secrets; telemetry off.
      NEMO_GUARDRAILS_NO_USAGE_STATS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,langgraph,guardrails]"
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Tests
        run: pytest -q --ignore=tests/test_neo4j_integration.py
      - name: Replay data is current
        run: python scripts/record_replay.py --check
      - name: Corrected text is the same under other hash seeds
        # The Tests step already compares the outputs with tests/golden_outputs.json
        # on this Python version; this repeats the run with PYTHONHASHSEED=1 and 2.
        run: python scripts/evaluate.py --invariants --seeds 2

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Build (live mode)
        run: npm run build
      - run: npm run lint
      - name: Tests
        run: npx vitest run
      - name: Build (replay mode)
        # A sub-path base, as on GitHub Pages (pages.yml passes the repo name)
        run: npm run build -- --base=/x/
        env:
          VITE_REPLAY: "1"

  neo4j:
    name: Neo4j integration
    runs-on: ubuntu-latest
    services:
      # Disposable: the integration tests delete every node
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/changeme
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p changeme 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 40s
    env:
      NEMO_GUARDRAILS_NO_USAGE_STATS: "1"
      AUTOCORRECTOR_NEO4J_URI: bolt://localhost:7687
      AUTOCORRECTOR_NEO4J_USER: neo4j
      AUTOCORRECTOR_NEO4J_PASSWORD: changeme
      AUTOCORRECTOR_NEO4J_TEST_WIPE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,neo4j,langgraph,guardrails]"
      - name: Seed
        run: python scripts/seed_neo4j.py
      - name: Integration tests
        # The fixture skips when it cannot connect, and 16 skips would exit 0
        shell: bash
        run: |
          pytest -q -rs tests/test_neo4j_integration.py | tee integration.txt
          grep -q "16 passed" integration.txt

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build the API image
        run: docker build --target production -t autocorrector:ci .
      - name: The API image runs unprivileged
        run: |
          uid="$(docker run --rm autocorrector:ci id -u)"
          test "$uid" = "10001"
      - name: Build the dashboard image
        run: docker build -t autocorrector-dashboard:ci dashboard

  wheel:
    name: Wheel (no extras)
    runs-on: ubuntu-latest
    env:
      FTLANG_CACHE: ${{ github.workspace }}/.cache/fast_langdetect
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build --wheel
      - name: The wheel has the server and not the held-out set
        run: python scripts/check_wheel.py dist/*.whl
      - name: Install the wheel alone
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
      - name: No optional package came with it
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          import importlib.util
          for name in ("guardrails", "langgraph", "neo4j", "nemoguardrails", "fastapi", "slowapi", "anthropic", "openai"):
              assert importlib.util.find_spec(name) is None, name
          from autocorrector.evaluation.registry import DATASETS
          assert sorted(DATASETS) == ["golden"], sorted(DATASETS)
          EOF
      - name: The command line starts
        run: |
          "$RUNNER_TEMP/venv/bin/autocorrector" --help
          "$RUNNER_TEMP/venv/bin/neurosymbolic-autocorrector" --help
      - name: Language model cache
        uses: actions/cache@v6
        with:
          path: .cache/fast_langdetect
          key: fast-langdetect-lid176
      - name: MCP tools over stdio, from the installed wheel
        # Run from a copy outside the checkout: in place, the script points the
        # server at the repository's src/ instead of the installed package.
        run: |
          mkdir "$RUNNER_TEMP/client" && cp scripts/test_mcp_client.py "$RUNNER_TEMP/client/"
          cd "$RUNNER_TEMP/client" && "$RUNNER_TEMP/venv/bin/python" test_mcp_client.py
