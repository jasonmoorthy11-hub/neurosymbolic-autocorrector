name: Publish to PyPI

# Prepared, not yet used. It runs only when started by hand from the Actions tab,
# and it can upload only after a trusted publisher for this repository, this
# workflow file and the `pypi` environment has been registered on pypi.org.
# No token is stored anywhere: PyPI accepts the run's OIDC identity.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v1.7)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }} # a tag, never a branch or a commit
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: The version is a final release and is the one the tag names
        env:
          TAG: ${{ inputs.tag }}
        run: |
          ls dist
          python - <<'EOF'
          import os, pathlib, re, sys
          wheel, = pathlib.Path("dist").glob("*.whl")
          version = wheel.name.split("-")[1]
          if not re.fullmatch(r"\d+(\.\d+)*", version):
              sys.exit(f"{version}: a development or pre-release version is not published")
          tag = os.environ["TAG"].removeprefix("v")
          if version not in (tag, f"{tag}.0"):
              sys.exit(f"tag {os.environ['TAG']} does not name version {version}")
          EOF
      - name: The wheel has the server and not the held-out set
        run: python scripts/check_wheel.py dist/*.whl
      # Both files in dist/ are uploaded. The sdist is the repository as tagged,
      # held-out set included, on purpose: only the wheel leaves it out.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Upload
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/neurosymbolic-autocorrector/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      # Pinned to a commit: this step holds the publishing identity
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
